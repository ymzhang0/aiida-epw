default_inputs:
  degaussw_list:
    - 0.005
    - 0.01
    - 0.015
    - 0.02
    - 0.025
    - 0.03
    - 0.035
    - 0.04
    - 0.045
    - 0.05
  convergence_threshold: 0.05
  options:
    resources:
      num_machines: 1
    max_wallclock_seconds: 43200  # Twelve hours
    withmpi: True
  parameters:
    INPUTEPW:
      broyden_beta: 0.4
      conv_thr_iaxis: 0.01
      degaussq: 0.5
      eps_acoustic: 1
      etf_mem: 1
      fsthick: 0.8
      mp_mesh_k: True
      muc: 0.13
      nqstep: 500
      nsiter: 1
      nstemp: 1
      selecqread: False
      temps: 10.0
      vme: 'dipole'
      wscut: 0.5

default_protocol: moderate
protocols:
  moderate:
    description: 'Protocol to perform a degaussw convergence calculation at normal precision.'
  precise:
    description: 'Protocol to perform a degaussw convergence calculation at high precision.'
  fast:
    description: 'Protocol to perform a degaussw convergence calculation at low precision for testing.'
    degaussw_list:
      - 0.1
      - 0.05
